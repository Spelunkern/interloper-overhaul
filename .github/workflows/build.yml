name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check world restoration boundaries
        run: dotnet run --project tests/PolicyChecks/PolicyChecks.csproj -c Release
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Check whitespace
        run: git diff --check
# Full mod compilation and runtime validation require a licensed local installation
# with MelonLoader-generated references. Do not upload proprietary game assemblies.
