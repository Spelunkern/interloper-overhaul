name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download pinned MelonLoader references
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/LavaGang/MelonLoader/releases/download/v0.7.3/MelonLoader.Linux.x64.zip -o /tmp/melonloader.zip
          echo "519f25639cde796a749ea0670daedfa251a45d0217608ac6e12c1bc6aa9e114f  /tmp/melonloader.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tld"
          unzip -q /tmp/melonloader.zip -d "$RUNNER_TEMP/tld"
      - name: Compile
        run: ./scripts/build.sh -p:GameDir="$RUNNER_TEMP/tld" -p:RestoreLockedMode=true
      - uses: actions/upload-artifact@v4
        with:
          name: TheLongDarkMod
          path: src/TheLongDarkMod/bin/Release/net6.0/TheLongDarkMod.dll
