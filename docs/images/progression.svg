<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">Firearm progression in Interloper Overhaul</title>
  <desc id="description">Obtain a finite common firearm, learn a variant schematic, and upgrade at the Cannery with materials and time. A variant can return to the common firearm at the Cannery for 30 minutes for revolvers or 60 minutes for rifles, without additional materials.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#92bdc5"/></marker>
  </defs>
  <rect width="1120" height="350" rx="18" fill="#12232b"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <text x="560" y="42" fill="#f2f1e9" font-size="23" font-weight="bold">Explore. Learn. Build. Reconfigure.</text>
    <text x="560" y="72" fill="#c1d1d5" font-size="15">One world rifle and one world revolver per new run</text>
    <g fill="#1e3540" stroke="#547783" stroke-width="1.5">
      <rect x="28" y="106" width="230" height="112" rx="10"/>
      <rect x="306" y="106" width="230" height="112" rx="10"/>
      <rect x="584" y="106" width="230" height="112" rx="10"/>
      <rect x="862" y="106" width="230" height="112" rx="10"/>
    </g>
    <g fill="#f2f1e9" font-size="18" font-weight="bold">
      <text x="143" y="141">Common firearm</text>
      <text x="421" y="141">Learn a schematic</text>
      <text x="699" y="141">Cannery upgrade</text>
      <text x="977" y="141">Usable variant</text>
    </g>
    <g fill="#c1d1d5" font-size="14">
      <text x="143" y="174">Find its expedition site</text><text x="143" y="196">Random condition, empty</text>
      <text x="421" y="174">Search native variant sites</text><text x="421" y="196">Knowledge stays with the run</text>
      <text x="699" y="174">Base + materials + time</text><text x="699" y="196">Tools and light required</text>
      <text x="977" y="174">Condition and identity retained</text><text x="977" y="196">No extra world firearm issued</text>
    </g>
    <text x="560" y="284" fill="#e3c48a" font-size="17">Revert at the Cannery: revolver 30 min / rifle 60 min</text>
    <text x="560" y="310" fill="#c1d1d5" font-size="14">Time only; no extra materials, tool, or material refund</text>
  </g>
  <g fill="none" stroke="#92bdc5" stroke-width="2" marker-end="url(#arrow)">
    <path d="M266 162H297"/><path d="M544 162H575"/><path d="M822 162H853"/>
    <path d="M977 226V246H143V226"/>
  </g>
</svg>
